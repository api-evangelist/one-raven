name: One Raven
description: 'One Raven is a Phoenix, Arizona smart-home technology company building a local-first home
  automation platform designed for homeowners who want simplicity, privacy, and control. Its core product
  is the One Raven Home Server, which processes and stores home data locally rather than in the cloud, and
  ships pre-paired with a curated set of devices such as thermostats, smart locks, leak-detection and
  security sensors. The platform emphasizes local data storage, encrypted remote access, and a
  subscription-free model. Backed by a $5M seed round led by proptech investor Fifth Wall. One Raven does
  not currently publish a public developer API, SDK, or documentation surface.'
